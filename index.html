<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Homepage of Hong Li, undergraduate student at Sichuan University.">
  <title>Hong Li | Sichuan University</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #202d36;
      --muted: #586a72;
      --line: #c9d4d2;
      --paper: #f7f8f4;
      --accent: #087e76;
      --accent-dark: #075d59;
      --warm: #c85c3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }
    .topline { height: 8px; background: linear-gradient(90deg, var(--accent) 0 68%, var(--warm) 68% 100%); }
    main { width: min(900px, calc(100% - 48px)); margin: 0 auto; padding: 92px 0 72px; }
    .eyebrow {
      margin: 0 0 22px;
      color: var(--accent-dark);
      font-family: "Segoe UI", sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.4px;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(48px, 7vw, 76px); font-weight: 400; line-height: 1.02; }
    .rule { width: 76px; height: 3px; margin: 30px 0 28px; background: var(--warm); }
    .role { margin: 0; font-family: "Segoe UI", sans-serif; color: var(--muted); font-size: 19px; line-height: 1.6; }
    .details { display: grid; grid-template-columns: 140px 1fr; gap: 14px 24px; max-width: 560px; margin-top: 58px; padding-top: 24px; border-top: 1px solid var(--line); }
    .label { color: var(--muted); font-family: "Segoe UI", sans-serif; font-size: 14px; }
    .value { font-size: 17px; overflow-wrap: anywhere; }
    a { color: var(--accent-dark); text-decoration-thickness: 1px; text-underline-offset: 4px; }
    a:hover { color: var(--warm); }
    footer { margin-top: 96px; color: var(--muted); font-family: "Segoe UI", sans-serif; font-size: 12px; }
    @media (max-width: 520px) {
      main { padding-top: 64px; }
      .details { grid-template-columns: 1fr; gap: 5px; margin-top: 42px; }
      .value + .label { margin-top: 14px; }
      footer { margin-top: 64px; }
    }
  </style>
</head>
<body>
  <div class="topline" aria-hidden="true"></div>
  <main>
    <p class="eyebrow">Personal Homepage</p>
    <h1>Hong Li</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="role">Undergraduate Student<br>Sichuan University</p>

    <section class="details" aria-label="Contact information">
      <div class="label">Institution</div>
      <div class="value">Sichuan University</div>
      <div class="label">Email</div>
      <div class="value"><a href="mailto:2024141460331@stu.scu.edu.cn">2024141460331@stu.scu.edu.cn</a></div>
    </section>
    <footer>Last updated November 2026</footer>
  </main>
</body>
</html>
